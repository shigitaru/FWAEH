{% macro review_stars(rating, size='md') -%}
{% set score = [5, [rating|int, 0]|max]|min %}
<div class="review-stars-display review-stars-display--{{ size }}" role="img" aria-label="{{ score }}/5">
    {% for i in range(1, 6) %}
    <span class="review-star{% if i <= score %} is-filled{% endif %}" aria-hidden="true">★</span>
    {% endfor %}
</div>
{%- endmacro %}
