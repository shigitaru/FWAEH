{% extends "base.html" %}
{% block title %}{{ t('campaign') }}{% endblock %}
{% block content %}
<div style="padding: 20px 30px;">
    <div class="page-header">
        <div class="section-title">{{ t('campaign') }}</div>
        <div class="page-meta">
            <span>{{ images|length }} {{ tc('result', images|length) }}</span>
        </div>
        <div class="page-hairline"></div>
    </div>
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 60px;">
        {% for img in images %}
        <div>
            <img src="{{ img.src }}" style="width: 100%; height: 65vh; object-fit: cover; display: block;" alt="">
            <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--text-muted); letter-spacing: 0.05em; border-top: 1px solid var(--border); padding-top: 6px;">
                <span>{{ img.ref }}</span><span>{{ img.location }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
