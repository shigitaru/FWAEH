{% extends "base.html" %}
{% block title %}{{ t('acc_verify_title') }}{% endblock %}
{% block content %}
<div class="account-page">
    <div class="account-page-inner account-guest-narrow">
        <section class="account-card" aria-labelledby="acc-verify-heading">
            <h2 id="acc-verify-heading" class="account-card-title">{{ t('acc_verify_title') }}</h2>
            <p class="account-card-lead">{{ t('acc_verify_lead').format(email=pending_email) }}</p>
            <form method="post" action="{{ url_for('account_verify_email') }}" class="account-form" autocomplete="one-time-code">
                <div class="account-field">
                    <label class="account-label" for="acc-verify-code">{{ t('acc_verify_code_label') }}</label>
                    <input id="acc-verify-code" type="text" name="code" required minlength="6" maxlength="6" class="account-input" placeholder="000000">
                </div>
                <button type="submit" class="account-btn-primary account-btn-primary--full">{{ t('acc_verify_submit') }}</button>
            </form>
            <form method="post" action="{{ url_for('account_resend_verification') }}" class="account-form account-form--tight-top">
                <button type="submit" class="account-btn-secondary account-btn-secondary--full">{{ t('acc_verify_resend') }}</button>
            </form>
            <p class="account-verify-footer-link">
                <a href="{{ url_for('account_verify_cancel') }}" class="account-text-link">{{ t('acc_verify_back_sign_in') }}</a>
            </p>
        </section>
    </div>
</div>
{% endblock %}
